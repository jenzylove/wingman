name: base keeper
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
concurrency:
  group: base-keeper
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Poll Base for crew sells every 4 seconds
        env:
          URL: ${{ vars.WINGMAN_URL }}
          KEY: ${{ secrets.HOOK_SECRET }}
        run: |
          end=$((SECONDS + 345 * 60))
          while [ $SECONDS -lt $end ]; do
            curl -s -m 50 -H "x-wingman-key: $KEY" "$URL/api/cron/base" | head -c 200; echo
            sleep 4
          done
      # Scheduled runs are unreliable on GitHub, so each run starts the next one.
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keeper.yml -R ${{ github.repository }}
