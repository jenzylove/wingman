[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read", path = "./script" }]

# ffi is only on in this profile, used by the Base fork test.
# FOUNDRY_PROFILE=fork BASE_RPC=https://base-rpc.publicnode.com forge test --match-contract Fork -vv
[profile.fork]
ffi = true

[rpc_endpoints]
base = "${BASE_RPC}"
